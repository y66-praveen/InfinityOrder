<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinity Order — MCU Watch Order Guide</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="bg-layer"></div>

  <header class="site-header">
    <h1>Infinity <span>Order</span></h1>
    <p class="tagline">Every movie, show &amp; timeline — in order.</p>
  </header>

  <nav class="saga-tabs" id="sagaTabs"></nav>

  <div class="toolbar">
    <div class="type-filters" id="typeFilters"></div>
    <button class="sort-btn" id="sortBtn" title="Toggle sort order">
      <span id="sortLabel">Oldest first</span>
      <span id="sortIcon">↓</span>
    </button>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search titles...">
    </div>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-label" id="progressLabel"></div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <button id="resetBtn" class="reset-btn">Reset progress</button>
  </div>

  <main id="listContainer" class="list-container"></main>

  <button id="scrollTopBtn" class="scroll-top-btn" title="Back to top">↑</button>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <button class="modal-close" id="modalClose">&times;</button>
      <span class="modal-badge" id="modalBadge"></span>
      <h2 id="modalTitle"></h2>
      <p class="modal-date" id="modalDate"></p>
      <p class="modal-desc" id="modalDesc"></p>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-inner">
      <span>© 2026 Dev Enterprises. All rights reserved.</span>
      <a href="#" class="ig-link" target="_blank" rel="noopener">@y66.praveen</a>
    </div>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
